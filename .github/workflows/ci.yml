name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_FROZEN: "1"
  XDG_CACHE_HOME: ${{ runner.temp }}/cache

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --group dev
      - run: uv run ruff check .
      # Type checking starts with the configuration and migration boundary and expands as
      # existing dynamic service code is annotated.
      - run: uv run pyright bob/config.py bob/migrate.py

  test-sqlite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --group dev
      - run: uv run pytest --cov --cov-report=term-missing --cov-report=xml
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

  test-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: bob_test
          POSTGRES_USER: bob
          POSTGRES_PASSWORD: test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bob -d bob_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      BOB_TEST_DATABASE_URL: postgresql+psycopg://bob:test-only@127.0.0.1:5432/bob_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --group dev
      - run: uv run pytest -q

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate production Compose configuration
        env:
          BOB_DOMAIN: bob.example.test
        run: |
          mkdir -p secrets
          printf 'ci-app-secret\n' > secrets/app_secret
          printf 'ci-db-password\n' > secrets/db_password
          docker compose -f compose.production.yml config --quiet
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: bob:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: docker run --rm -e BOB_DATA_DIR=/tmp/bob-data bob:ci python -m bob.smoke
